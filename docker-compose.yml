version: '3.8'

services:
  # Сервис базы данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: shop_postgres_db
    restart: always
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  # Сервис бэкенда на Dart Shelf
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shop_backend_api
    restart: always
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: shop_db
      DB_USER: postgres
      DB_PASS: "1234"
      # Учетные данные SMTP для отправки почты (загружаются из локальных настроек)
      SMTP_USERNAME: kabdrashev111@gmail.com
      SMTP_PASSWORD: ncvrngksvjteeigp
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  db-data:
